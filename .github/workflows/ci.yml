name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  grammar-tests:
    name: grammar-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:grammar

  grammar-sync:
    name: grammar-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:grammar-sync

  corpus:
    name: corpus
    runs-on: ubuntu-latest
    env:
      FOUNDRY_ENGINE_PATH: ${{ github.workspace }}/foundry-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out Foundry engine corpus
        uses: actions/checkout@v4
        with:
          repository: cafecito-games/Foundry
          # Foundry v0.1.0-alpha.19, matching foundry-grammar.json.
          ref: 7a86a1464be0699c81a8a5b5c849447b4a7707bf
          path: foundry-engine
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:corpus

  dap-conformance:
    name: dap-conformance
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout FoundryScript extension
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Checkout pinned Foundry engine
        uses: actions/checkout@v4
        with:
          repository: cafecito-games/Foundry
          ref: 9e902f3815a62c95eec4f405b025e28b84b46b90
          path: .foundry-engine
          submodules: recursive
      - name: Install Foundry build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-bin
          python -m pip install scons==4.10.1
      - name: Restore Foundry build cache
        uses: actions/cache@v4
        with:
          path: .foundry-engine/.scons_cache
          key: dap-conformance-foundry-9e902f381-${{ runner.os }}-${{ runner.arch }}
      - name: Build pinned Foundry editor
        working-directory: .foundry-engine
        run: >-
          scons platform=linuxbsd target=editor dev_mode=yes dev_build=yes
          module_text_server_fb_enabled=yes
          cache_path="$GITHUB_WORKSPACE/.foundry-engine/.scons_cache"
          redirect_build_objects=no
      - name: Run required real-engine DAP conformance
        env:
          FOUNDRY_ENGINE_PATH: ${{ github.workspace }}/.foundry-engine/bin/foundry.linuxbsd.editor.dev.x86_64
        run: npm run test:dap-conformance

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: foundryscript-vsix
          path: "*.vsix"
