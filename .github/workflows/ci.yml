name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  grammar-tests:
    name: grammar-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:grammar

  grammar-sync:
    name: grammar-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:grammar-sync

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run audit:development

  vscode-minimum:
    name: vscode-minimum
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run test:vscode-minimum

  vscode-integration:
    name: vscode-integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - run: xvfb-run -a npm run test:vscode-integration
        env:
          FOUNDRY_E2E_VSIX: foundryscript-0.1.0.vsix
      - name: Upload Extension Host failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-integration-logs
          path: /tmp/fse2e-*/**

  corpus:
    name: corpus
    runs-on: ubuntu-latest
    env:
      FOUNDRY_ENGINE_PATH: ${{ github.workspace }}/foundry-engine
    steps:
      - uses: actions/checkout@v7
      - name: Check out Foundry engine corpus
        uses: actions/checkout@v7
        with:
          repository: cafecito-games/Foundry
          # Foundry v0.1.0-alpha.24, matching foundry-grammar.json.
          ref: e91ab07e63ce0a783778dc885bb11d9c65603256
          path: foundry-engine
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:corpus

  dap-conformance:
    name: dap-conformance
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      FOUNDRY_RELEASE_ASSET: Foundry_v0.1.0-alpha.24_linux.x86_64.zip
      FOUNDRY_RELEASE_SHA256: 5499f49a9aa298d97d98a025bb002c70816179e5fcf8a2104a622cfbf1e9e076
    steps:
      - name: Checkout FoundryScript extension
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Download verified Foundry v0.1.0-alpha.24 release asset
        run: |
          mkdir -p .foundry-release
          curl --fail --location --retry 3 \
            --output ".foundry-release/${FOUNDRY_RELEASE_ASSET}" \
            "https://github.com/cafecito-games/Foundry/releases/download/v0.1.0-alpha.24/${FOUNDRY_RELEASE_ASSET}"
          echo "${FOUNDRY_RELEASE_SHA256}  .foundry-release/${FOUNDRY_RELEASE_ASSET}" \
            | sha256sum --check
          unzip -q ".foundry-release/${FOUNDRY_RELEASE_ASSET}" -d .foundry-release
          chmod +x .foundry-release/foundry.linuxbsd.editor.x86_64
      - name: Run required real-engine DAP conformance
        env:
          FOUNDRY_ENGINE_PATH: ${{ github.workspace }}/.foundry-release/foundry.linuxbsd.editor.x86_64
        run: npm run test:dap-conformance

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run check:package-files
      - uses: actions/upload-artifact@v7
        with:
          name: foundryscript-vsix
          path: "*.vsix"
